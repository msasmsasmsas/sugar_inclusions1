apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sugar-images-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: hcloud-volumes  # Hetzner Cloud storage class
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sugar-output-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: hcloud-volumes  # Hetzner Cloud storage class
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: hcloud-volumes  # Hetzner Cloud storage class


